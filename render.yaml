services:
  - type: web
    name: edgeguard-ai-dashboard
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python train_model.py

    startCommand: streamlit run app1.py --server.address 0.0.0.0 --server.port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5